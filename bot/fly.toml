# Fly.io config for the Anthropic-sources Telegram bot.
# After editing, deploy with: fly deploy --config bot/fly.toml --dockerfile bot/Dockerfile

# Replace "anthropic-source-bot" with a globally-unique app name during `fly launch`.
app = "anthropic-source-bot-scottw"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

# No HTTP service: this is a polling-only bot. Fly will keep the process running.

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256

[processes]
  app = "python bot/telegram_bot.py"
